name: BuildAndTest

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: python

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, macos-13, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Add requirements
      run: python -m pip install setuptools==83.0.0 pybind11==3.0.4 cibuildwheel

    - name: Copy Build Files
      run: python setup.py copy_build_files

    - name: Build Packages
      run: cibuildwheel --output-dir "dist"
      env:
        CIBW_ARCHS: auto64
        CIBW_BUILD_FRONTEND: "pip; args: --verbose"
        CIBW_ENVIRONMENT: "FORCE_AVX2=1 CMAKE_BUILD_PARALLEL_LEVEL=4"
        CIBW_ENVIRONMENT_MACOS: "FORCE_AVX2=1 MACOSX_DEPLOYMENT_TARGET=13.3 CMAKE_BUILD_PARALLEL_LEVEL=4"
        CIBW_SKIP: "cp*t-* pp*win*"

  build_sdist:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Add requirements
      run: python -m pip install setuptools==83.0.0 pybind11==3.0.4

    - name: Copy Build Files
      run: python setup.py copy_build_files

    - name: Build Source Distribution
      run: python setup.py sdist
