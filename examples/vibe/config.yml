float:
  any:
  - base_args: ['@metric']
    constructor: DegANN
    disabled: false
    gpu: false
    ood: false
    singularity_image: deg
    module: vibe.algorithms.deg
    name: deg
    run_groups:
      base:
        args:
          k: [16, 24, 30, 40, 48]
          opt_target: ['LowLID', 'HighLID', 'StreamingData']
          extend_k: [60]
          build_eps: [0.1]          
          improve_k: [0]
          improve_eps: [0.0]
          use_flas: [true]
          threads: [1]
        query_args:
          search_eps: [0.0, 0.01, 0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.7, 1.0, 1.5, 2.0]

