float:
  any:
  - name: deg
    module: vibe.algorithms.deg
    constructor: DEG
    singularity_image: deg
    disabled: false
    gpu: false
    ood: false
    base_args: ['@metric']
    run_groups:
      base:
        args:
          k: [16, 24, 30, 40, 48]
          opt_target: ['LowLID', 'StreamingData']
          prune_non_rng: [false, true]
        query_args:
          search_eps: [0.0, 0.005, 0.01, 0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.15, 0.2, 0.25, 0.3]
  - name: deg-qg
    module: vibe.algorithms.deg
    constructor: QG
    singularity_image: deg
    disabled: false
    gpu: false
    ood: false
    base_args: ['@metric']
    run_groups:
      linear_pool:
        args:
          k: [48]
          opt_target: ['LowLID']
          prune_non_rng: [false]
        query_args:
          rerank_size_factor: [1.0, 1.15, 1.35]
          ef: [60, 80, 100, 150, 200, 250, 300, 350, 400, 500, 600, 700, 800, 845, 900, 1000]
